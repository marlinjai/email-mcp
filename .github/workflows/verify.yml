name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  roadmap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: marlinjai/actions-shared/roadmap-check@roadmap-check-v1
        with:
          max-age: 30

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
